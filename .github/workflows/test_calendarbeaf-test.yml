# CalendarBEAF-TEST Deployment Workflow
# Official Microsoft-recommended pattern: CI-built node_modules + WEBSITE_RUN_FROM_PACKAGE=1
# Reference: https://learn.microsoft.com/en-us/azure/azure-functions/functions-how-to-github-actions
#
# Key insight: WEBSITE_RUN_FROM_PACKAGE=1 and SCM_DO_BUILD_DURING_DEPLOYMENT=true
# are MUTUALLY EXCLUSIVE - using both causes silent build failures.
#
# Use windows-latest runner to match Azure Windows Consumption Plan target OS.

name: Build and deploy Node.js project to Azure Function App - CalendarBEAF-TEST

on:
  push:
    branches:
      - TEST
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: 'CalendarBEAF-TEST'
  AZURE_FUNCTIONAPP_PACKAGE_PATH: '.'
  NODE_VERSION: '20.x'

jobs:
  build-and-deploy:
    runs-on: windows-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: 'Checkout code'
        uses: actions/checkout@v4

      - name: 'Setup Node.js'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 'Install, build, and prune'
        shell: pwsh
        run: |
          pushd './${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}'
          npm ci
          npm run build --if-present
          npm run lint --if-present
          npm prune --production
          popd

      - name: 'Login to Azure'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_F146423A44BC44A9A904B5FD339D5984 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_BB21745BBF2B46F6A1A75DEEC21055EC }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_F3F79772122B4B5FB666E43ED4B2D312 }}

      - name: 'Deploy to Azure Functions'
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}

      - name: 'Verify deployment'
        shell: pwsh
        run: |
          Write-Host "Waiting for app to start..."
          Start-Sleep -Seconds 30
          Write-Host "Checking health endpoint..."
          try {
            $response = Invoke-WebRequest -Uri "https://calendarbeaf-test.azurewebsites.net/api/health" -UseBasicParsing
            Write-Host "Health check status: $($response.StatusCode)"
            if ($response.StatusCode -ne 200) {
              Write-Host "WARNING: Health check returned unexpected status"
              exit 1
            }
            Write-Host "Deployment verified successfully!"
          } catch {
            Write-Host "ERROR: Health check failed - $($_.Exception.Message)"
            exit 1
          }
